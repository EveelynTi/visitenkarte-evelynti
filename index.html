<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digitale Visitenkarte</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="dein-foto.jpg" alt="Profilbild" class="profile-img">
    <h2>Max Mustermann</h2>
    <p>Webentwickler</p>
    <a href="tel:+123456789">Telefon: +123456789</a>
    <br>
    <a href="mailto:max.mustermann@email.com">E-Mail: max.mustermann@email.com</a>
    <br>
    <a href="https://www.deine-website.com">Website: deine-website.com</a>
    <br>

      Kontakt speichern

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
